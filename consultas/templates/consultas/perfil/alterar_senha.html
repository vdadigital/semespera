{% extends "consultas/base.html" %}
{% block content %}
<div class="card" style="max-width:440px;">
  <div class="card-title">🔑 Alterar Senha</div>

  {% if sucesso %}
  <div style="background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:14px;color:#166534;font-weight:700;margin-bottom:18px;">
    ✅ Senha alterada com sucesso!
  </div>
  {% endif %}

  {% if erro %}
  <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:14px;color:#dc2626;font-weight:700;margin-bottom:18px;">
    ❌ {{ erro }}
  </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">SENHA ATUAL</label>
      <input type="password" name="senha_atual" class="form-control" required>
    </div>
    <div class="form-group">
      <label class="form-label">NOVA SENHA</label>
      <input type="password" name="nova_senha" class="form-control" placeholder="Mínimo 6 caracteres" required>
    </div>
    <div class="form-group">
      <label class="form-label">CONFIRMAR NOVA SENHA</label>
      <input type="password" name="confirmar" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary btn-full">🔑 ALTERAR SENHA</button>
  </form>
</div>
{% endblock %}
