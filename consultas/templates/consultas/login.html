<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sem Espera – Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f2460 0%, #1a3a8f 60%, #2d5be3 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: #1a3a8f;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900; color: #fff;
      margin-bottom: 12px;
    }
    .logo h1 { font-size: 28px; font-weight: 900; color: #1a3a8f; letter-spacing: 2px; }
    .logo p { font-size: 11px; color: #888; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 11px; font-weight: 800; color: #555; margin-bottom: 6px; letter-spacing: .5px; }
    .form-control {
      width: 100%; padding: 13px 16px;
      border: 1.5px solid #d0daf0; border-radius: 8px;
      font-size: 15px; color: #1a2a4a; outline: none;
      transition: border .2s;
    }
    .form-control:focus { border-color: #1a3a8f; }

    .btn-login {
      width: 100%; padding: 15px;
      background: #1a3a8f; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 800;
      cursor: pointer; letter-spacing: 1px;
      transition: background .2s;
      margin-top: 8px;
    }
    .btn-login:hover { background: #152d70; }

    .erro {
      background: #fee2e2; border: 1px solid #fca5a5;
      border-radius: 8px; padding: 12px 16px;
      font-size: 13px; color: #dc2626; font-weight: 600;
      margin-bottom: 18px; text-align: center;
    }

    .footer-txt {
      text-align: center; margin-top: 24px;
      font-size: 11px; color: #bbb;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">+</div>
      <h1>SEM ESPERA</h1>
      <p>Sistema de Gerenciamento</p>
    </div>

    {% if form.errors %}
    <div class="erro">❌ Usuário ou senha incorretos.</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">USUÁRIO</label>
        <input type="text" name="username" class="form-control"
               placeholder="Digite seu usuário" autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">SENHA</label>
        <input type="password" name="password" class="form-control"
               placeholder="Digite sua senha" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">🔐 ENTRAR</button>
    </form>

    <div class="footer-txt">Unidade Boa Esperança</div>
  </div>
</body>
</html>
