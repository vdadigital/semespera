{% extends "consultas/master/base_master.html" %}
{% block master_content %}
<div style="margin-bottom:20px;">
  <a href="{% url 'master_usuarios' %}" style="font-size:12px;color:#64748b;text-decoration:none;">← Voltar para Usuários</a>
  <h2 style="font-size:22px;font-weight:900;color:#f1f5f9;margin-top:8px;">✏️ Editar Usuário</h2>
</div>
<div style="max-width:480px;">
  <div class="m-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #334155;">
      <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;">
        {{ perfil.usuario.username|slice:":1"|upper }}
      </div>
      <div>
        <div style="font-weight:800;font-size:16px;color:#f1f5f9;">{{ perfil.usuario.username }}</div>
        <div style="font-size:12px;color:#64748b;">{{ perfil.empresa }}</div>
      </div>
    </div>
    <form method="POST">
      {% csrf_token %}
      <div class="m-form-group">
        <label class="m-form-label">Transferir para Empresa</label>
        <select name="empresa_id" class="m-form-control" required>
          {% for emp in empresas %}
          <option value="{{ emp.id }}" {% if emp.id == perfil.empresa.id %}selected{% endif %}>
            {{ emp.nome_fantasia|default:emp.nome }}
          </option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="m-btn m-btn-primary m-btn-full">💾 SALVAR</button>
    </form>
  </div>
</div>
{% endblock %}
